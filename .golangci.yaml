version: "2"

linters:
  default: none
  enable:
    - err113
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unconvert
    - unused
    - wrapcheck
    - cyclop
    - gosec
    - noctx
    - prealloc
    - revive
    - noinlineerr
    - gocritic
  exclusions:
    paths:
    - "_test.go"